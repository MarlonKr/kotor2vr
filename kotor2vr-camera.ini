[camera]
; Applies only to this game's window during the active native VR stream.
disable_monitor_vsync=1
; Opt-in world-eye sampling once per full XR request, even while walking.
; Independent of stereo_request_gate; monitor/game CPU keep their normal rate.
; A coarse GetTickCount64 100ms watchdog refreshes a stalled host request.
stereo_request_cadence=0
first_person=1
; Eye height follows this character's FreeLookHook, then CameraHook.
; Missing/invalid model hooks retain the authored camera.
first_person_forward_m=0.10
; Keep gravity upright when recentering while looking down or tilting the head.
; Set 0 for the previously confirmed full-orientation recenter behavior.
recenter_yaw_only=1
; First-person only: hide human HeadHook attachments, keeping body and weapons.
; Short models use named Head/Eyes pivots, keeping separate chassis/leg/gun parts.
experimental_hide_self=1
; Explicit calibration: engine units represented by one physical metre.
; 1.0 is a starting value; world scale still needs headset verification.
engine_units_per_metre=1.0

